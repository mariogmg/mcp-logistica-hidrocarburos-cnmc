[project]
name = "mcp-logistica-hidrocarburos-cnmc"
version = "0.2.0"
description = "Histórico de la logística de productos petrolíferos publicada por la CNMC, consultable mediante un servidor MCP de solo lectura. Proyecto no oficial."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pdfplumber>=0.11",
    "pyyaml>=6.0",
    # El SDK MCP v2 cambió los imports (MCPServer, Client): se fija la versión comprobada.
    "mcp==2.3.0",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.10"]

[project.scripts]
cnmc-logistica = "cnmc_logistica.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cnmc_logistica"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # textos en español: tildes y símbolos legítimos

[tool.ruff.lint.per-file-ignores]
# Parsers de PDF: expresiones largas sobre coordenadas y cierres dentro de bucles por página.
"src/cnmc_logistica/parsers/pdf_precios.py" = ["E501", "B023", "RUF007", "SIM102"]
"src/cnmc_logistica/parsers/pdf.py" = ["E501"]
