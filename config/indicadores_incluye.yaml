# «Suministro» significa cosas distintas según la instalación: en un aeropuerto
# es el suministro a la aeronave; en una terminal, la salida del producto.
por_tipo_instalacion:
  aeroportuaria:
    Suministro: [incluye_puesta_a_bordo]
    Entrega o suministro: [incluye_puesta_a_bordo]
  almacenamiento:
    Suministro: [incluye_expedicion]
    Entrega o suministro: [incluye_expedicion]
