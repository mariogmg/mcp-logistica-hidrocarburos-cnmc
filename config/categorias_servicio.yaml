# Correspondencia etiqueta de servicio → categoría_servicio.
#
# Para qué sirve: cada operador nombra sus servicios a su manera. Para no
# comparar peras con manzanas, las consultas comparan por categoría, no por
# etiqueta. Esta tabla es la ÚNICA fuente de esa correspondencia: el código no
# deduce categorías con expresiones regulares.
#
# Reglas:
# - La clave es la etiqueta tal como aparece en el portal (se ignoran
#   mayúsculas/minúsculas y espacios repetidos; las tildes SÍ cuentan).
# - Una etiqueta que no esté aquí se carga como «sin_categoria» y genera un
#   aviso en `ejecuciones`. Se arregla añadiéndola aquí y ejecutando `reconstruir`.
# - `por_operador` permite que una misma etiqueta signifique otra cosa para un
#   operador concreto (clave: código del buscador). Hoy no se usa.

categorias:
  almacenamiento: Solo almacenamiento (capacidad o volumen almacenado)
  almacenamiento_y_manipulacion: Almacenamiento con la manipulación incluida en el mismo precio
  manipulacion: Manipulación facturada aparte
  logistica_basica: Paquete logístico (recepción + almacenamiento operativo + transporte y/o expedición)
  servicios_aeroportuarios: Recepción, almacenamiento y control en la instalación aeroportuaria
  bunker: Servicio de búnker (suministro a buques)
  recepcion: Entrada de producto (buque, camión, tubería, tren, gabarra)
  expedicion: Salida de producto (buque, camión, tubería, tren, gabarra)
  almacenamiento_adicional: Almacenamiento por encima del operativo contratado
  almacenamiento_no_operativo: Almacenamiento estratégico o de seguridad (no operativo)
  transferencias: Cambio de titularidad del producto dentro de la instalación
  reconsignacion: Cambio de instalación de entrega (reconsignación)
  trasiego: Movimiento de producto entre tanques o terminales
  transporte: Transporte de producto hasta otra instalación
  abastecimiento_aeroportuario: Transporte y reposición de producto en la instalación aeroportuaria
  puesta_a_bordo: Suministro a la aeronave (into-plane)
  carga_repostadora_hidrante: Carga en unidad repostadora o uso de la red de hidrante
  aditivacion: Aditivos (calidad, antifrío, antiestático)
  coloracion_trazado: Colorantes y trazadores fiscales
  mezcla_biocarburantes: Mezcla o blending con biocarburantes
  analisis_calidad: Análisis y mantenimiento de la calidad
  calentamiento: Calentamiento o calefacción del producto
  limpieza_tanques: Limpieza de tanques
  gestion_y_programacion: Gestión administrativa, aduanera o de aprovisionamiento
  servicio_operativo: Servicio operativo aeroportuario (etiqueta propia de Exolum Aviation)
  otros: Etiquetas que no describen un servicio comparable

