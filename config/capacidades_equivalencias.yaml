# Equivalencias del PDF «Características de las instalaciones de almacenamiento»
# con las instalaciones del portal (idTanque).
#
# Por qué existe: el PDF identifica cada instalación por compañía y nombre
# («Álava (Rivabellosa)»), no por id, y los nombres no coinciden con los del
# mapa. Esta tabla está curada a mano; el código no intenta adivinar parecidos.
#
# Reglas:
# - Estructura: ámbito → compañía (tal como aparece en el PDF) → instalación → idTanque.
# - `null` = revisada: esa instalación no tiene ficha en el portal. No avisa.
# - Una instalación del PDF que no esté aquí se carga con id_tanque NULL y
#   genera el aviso «capacidad_sin_equivalencia» en `ejecuciones`.
# - Varias filas del PDF pueden apuntar al mismo idTanque (el portal agrupa
#   El Calero/Ziérbana y Algeciras/San Roque en una sola ficha).

