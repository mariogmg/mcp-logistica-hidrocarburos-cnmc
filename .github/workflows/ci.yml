name: CI

on:
  push:
    branches: ["**"] # no en las etiquetas raw-AAAA-MM-DD de las Releases
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar dependencias (versiones fijadas en uv.lock)
        run: uv sync --locked
      - name: Ruff (errores)
        run: uv run ruff check .
      - name: Ruff (formato)
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  docker:
    # Construye la imagen del servidor (sin publicarla) y comprueba que arranca.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construir la imagen
        run: docker build -t cnmc-logistica:ci .
      - name: La imagen arranca y lee la base
        run: docker run --rm cnmc-logistica:ci cnmc-logistica info
